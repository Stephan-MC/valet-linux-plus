map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen VALET_PORT default_server;
    listen 88;
    root /;
    charset utf-8;
    client_max_body_size 128M;

    location /VALET_STATIC_PREFIX/ {
        internal;
        alias /;
        try_files $uri $uri/ @octane;
    }

    location / {
        rewrite ^ VALET_SERVER_PATH last;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log off;
    error_log VALET_HOME_PATH/Log/nginx-error.log;

    error_page 404 VALET_SERVER_PATH;

    location ~ \.php$ {
        try_files @octane @fpm;
    }

    # Handle Fastcgi request with php-fpm
    location @fpm {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:VALET_FPM_SOCKET_FILE;
        fastcgi_index VALET_SERVER_PATH;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME VALET_SERVER_PATH;
    }

    # Handle laravel octane request
    location @octane {
        set $suffix "";


        if ($uri ~ "^(/index.php|VALET_SERVER_PATH)$") {
            set $suffix ?$query_string;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://127.0.0.1:8000$suffix;
    }

    # Deny Access to all .ht(access|password|...) files used by apache
    location ~ /\.ht {
        deny all;
    }
}
